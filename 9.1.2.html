<!DOCTYPE html>
<html>
<head>
  <title>Fibonacci Series using Function</title>
</head>
<body>
  <h2>Fibonacci Series up to Given Number</h2>
  <script>
    // Function to display Fibonacci series up to n
    function fibonacciSeries(n) {
      let a = 0, b = 1, next;
      document.write("Fibonacci Series up to " + n + ":<br>");
      document.write(a + " ");
      if (n >= 1) {
        document.write(b + " ");
      }
      next = a + b;
      while (next <= n) {
        document.write(next + " ");
        a = b;
        b = next;
        next = a + b;
      }
    }
    // Taking input from user
    let num = parseInt(prompt("Enter a number:"));
    // Validate input
    if (!isNaN(num) && num >= 0) {
      fibonacciSeries(num);
    } else {
      document.write("Please enter a valid non-negative number.");
    }
  </script>
</body>
</html>
